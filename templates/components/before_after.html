{% load static i18n %}
<section class="container comparison-section" id="before-after">
  <div class="section-header">
    <div class="section-badge ba-top-badge">
      {{ t.ba_badge }}
    </div>
    <h2>{{ t.ba_title|safe }}</h2>
    <p>{{ t.ba_sub }}</p>
  </div>

  <div class="ba-slider-container">
    <!-- After Image (Background) -->
    <img src="{% static 'img/repair_after.jpg' %}" class="ba-image" alt="{{ t.ba_after_badge }}" draggable="false" onerror="this.onerror=null;this.src='{% static 'img/models/iphone_16_pro_max.jpg' %}';">

    <!-- Before Image (Clipped Overlay) -->
    <div class="ba-before">
      <img src="{% static 'img/repair_before.png' %}" class="ba-before-img" alt="{{ t.ba_before_badge }}" draggable="false" onerror="this.onerror=null;this.src='{% static 'img/models/iphone_15_pro.jpg' %}';">
    </div>

    <!-- Stationary Badges (Never wrap or compress) -->
    <span class="ba-badge before">{{ t.ba_before_badge }}</span>
    <span class="ba-badge after">{{ t.ba_after_badge }}</span>

    <!-- Drag Handle -->
    <div class="ba-handle">⟷</div>
  </div>
</section>
