version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mobiprice_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mobiprice}
      POSTGRES_USER: ${DB_USER:-mobiprice}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mobiprice_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: mobiprice_web
    restart: always
    command: sh -c "python manage.py migrate && python manage.py seed_data && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-mobiprice}
      - DB_USER=${DB_USER:-mobiprice}
      - DB_PASSWORD=${DB_PASSWORD:-mobiprice_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - PYTHONUNBUFFERED=1
    depends_on:
      - db

  bot:
    build: .
    container_name: mobiprice_bot
    restart: always
    command: python -m bot.main
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-mobiprice}
      - DB_USER=${DB_USER:-mobiprice}
      - DB_PASSWORD=${DB_PASSWORD:-mobiprice_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - web

volumes:
  postgres_data:
