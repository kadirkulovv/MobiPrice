# Upstream Gunicorn socket / port
upstream mobiprice_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP Server — Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mobi-price.uz www.mobi-price.uz;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mobi-price.uz www.mobi-price.uz;

    # SSL Certificate Paths (Configure with certbot)
    # ssl_certificate /etc/letsencrypt/live/mobi-price.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mobi-price.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum file upload size (Images, Excel imports)
    client_max_body_size 32M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Static Files caching
    location /static/ {
        alias /var/www/mobiprice/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Media Files (Device images, photos, uploads)
    location /media/ {
        alias /var/www/mobiprice/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Robots and Sitemap
    location = /robots.txt {
        proxy_pass http://mobiprice_backend;
        access_log off;
    }

    location = /sitemap.xml {
        proxy_pass http://mobiprice_backend;
        access_log off;
    }

    # Gunicorn Proxy
    location / {
        proxy_pass http://mobiprice_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 90;
    }
}
